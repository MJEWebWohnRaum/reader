<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Everything stays local: documents (e.g. EPUB chapters, which inherit this policy)
         must not load anything from the network. Images and media only come from blob:
         or data: URLs, so unresolved relative EPUB image paths can't reach the app's
         origin either. Fonts also allow 'self' for pdf.js's bundled standard fonts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src blob: data:; font-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-src 'self' blob: about:; media-src blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Reader</title>
  </head>
  <body>
    <header class="toolbar" id="toolbar">
      <button type="button" id="open-button" title="Datei öffnen">Öffnen</button>
      <span class="file-name" id="file-name"></span>
      <span class="spacer"></span>
      <span class="text-options" id="text-options">
        <button type="button" class="text-button" id="text-smaller-button" title="Schrift kleiner (−)" aria-label="Schrift kleiner">A−</button>
        <button type="button" class="text-button" id="text-larger-button" title="Schrift größer (+)" aria-label="Schrift größer">A+</button>
        <button type="button" class="icon-button" id="text-width-button" title="Textbreite: mittel (W)" aria-label="Textbreite ändern">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4" /></svg>
        </button>
      </span>
      <button type="button" class="icon-button" id="double-page-button" title="Doppelseite (2)" aria-label="Doppelseite umschalten" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8v14H3zM13 5h8v14h-8z" /></svg>
      </button>
      <button type="button" class="icon-button" id="theme-button" title="Darkmode umschalten (D)" aria-label="Darkmode umschalten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      </button>
      <button type="button" class="icon-button" id="fullscreen-button" title="Vollbild (F)" aria-label="Vollbild umschalten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
      </button>
    </header>

    <main class="stage" id="stage">
      <div class="page-host" id="page-host"></div>
      <div class="input-layer" id="input-layer"></div>
      <div class="empty-hint" id="empty-hint">
        <p>Datei hierher ziehen oder</p>
        <button type="button" id="empty-open-button">Datei öffnen</button>
        <p class="formats" id="formats"></p>
      </div>
      <div class="loading" id="loading">Wird geladen …</div>
      <div class="message" id="message" role="alert"></div>
    </main>

    <div class="page-indicator" id="page-indicator" aria-live="polite"></div>
    <div class="drop-overlay" id="drop-overlay">Loslassen zum Öffnen</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
